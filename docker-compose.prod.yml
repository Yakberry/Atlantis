# Боевой режим на одной машине: приложение + база. Запуск: docker compose -f docker-compose.prod.yml up --build -d
# (для разработки по-прежнему используется docker-compose.yml с одной базой и `npm run dev`).
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://atlantis:atlantis@db:5432/atlantis
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atlantis
      POSTGRES_PASSWORD: atlantis
      POSTGRES_DB: atlantis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlantis"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
